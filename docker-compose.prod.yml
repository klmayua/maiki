services:
  postgres:
    image: postgres:15-alpine
    container_name: maiki-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maiki
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - maiki-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: maiki-redis
    ports:
      - "127.0.0.1:6381:6379"
    networks:
      - maiki-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maiki-backend
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=maiki
      - DATABASE_URL=postgresql://postgres:postgres@postgres/maiki
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - BACKEND_CORS_ORIGINS=["https://maiki.nyamabo.com"]
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - maiki-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: maiki-frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://maiki.nyamabo.com/api
      - NEXT_PUBLIC_APP_ENV=production
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - backend
    networks:
      - maiki-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  maiki-network:
    driver: bridge
